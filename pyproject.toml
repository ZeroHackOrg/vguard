[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vguard"
version = "0.1.0"
description = "Zero-Trust Spatial Firewall & Anomaly Proxy for Vector Databases and RAG pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR ZeroHack-Commercial" }
authors = [{ name = "ZeroHack.org", email = "solutions@zerohack.org" }]
keywords = ["vector-database", "security", "rag", "embeddings", "firewall", "anomaly-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine", "hypothesis"]

[project.urls]
Homepage = "https://zerohack.org"
Documentation = "https://zerohack.org/docs/vguard"
Repository = "https://github.com/ZeroHackOrg/vguard"

[project.scripts]
vguard = "vguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120